---
layout: default
---

<div class="post-content">
	<h1>
		{{ page.title }}
	</h1>
	{% if page.tags.size > 0 %}
		<p class="tag-block">
			{% for tag in page.tags %}
				<a class="tag" href="/tag/{{ tag }}">{{ tag }}</a>
			{% endfor %}
		</p>
	{% endif %}
	{% if site.hide_post_date != true %}
		{% include post-date.html %}
	{% endif %}
	{% if page.image %}
		<div class="featured-image">
			<img src="{{ site.github.url }}/assets/img/{{ page.image.name }}" alt="{{ page.image.alt }}">
		</div>
	{% endif %}
	<article>
		{{ content }}
	</article>
	<hr>
</div>
