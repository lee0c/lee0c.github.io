---
layout: default
---

<div class="page-content">
	<h1>
		{{ page.title }}
	</h1>
	<article>
		{{ content }}
	</article>
</div>

<div>
	{% for post in site.posts %}
		{% if post.category == page.category and post.tag != 'draft' %}
			{% include featured-post.html %}
		{% endif %}
	{% endfor %}
</div>
