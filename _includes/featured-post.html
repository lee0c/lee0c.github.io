<article>
  <div class="featured-post">
    <a class="featured-title" href="{{ site.github.url }}{{ post.url }}">
      <img src="{{ site.github.url }}/assets/img/{{ post.image.name }}" alt="{{ post.image.alt }}">
      <h2>{{ post.title }}</h2>
    </a>
    <div class="featured-tags">
      <p>
        {% for tag in post.tags %}
          <a href="/tag/{{ tag }}">{{ tag }}</a>
        {% endfor %}
      </p>
    </div>
  </div>
</article>
