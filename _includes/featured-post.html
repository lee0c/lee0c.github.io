<article>
	<a class="featured-post" href="{{ site.github.url }}{{ post.url }}">
		<img src="{{ site.github.url }}/assets/img/{{ post.image.name }}" alt="{{ post.image.alt }}">
		<h2>{{ post.title }}</h2>
		<div class="featured-tags">
			{% for tag in post.tags %}
				<p>{{ tag }}</p>
			{% endfor %}
		</div>
	</a>
</article>
